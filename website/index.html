<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to My Website</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(
                135deg,
                #667eea 0%,
                #764ba2 25%,
                #ff6b6b 50%,
                #feca57 100%
            );
            overflow-x: hidden;
            position: relative;
            display: flex;
            flex-direction: column;
            color: white;
        }

        /* Floating background circles */
        .circle {
            position: absolute;
            border-radius: 50%;
            background: rgba(255,255,255,0.12);
            backdrop-filter: blur(10px);
            animation: float 10s infinite ease-in-out;
        }

        .circle:nth-child(1) {
            width: 200px;
            height: 200px;
            top: 10%;
            left: 10%;
        }

        .circle:nth-child(2) {
            width: 120px;
            height: 120px;
            top: 65%;
            left: 15%;
            animation-delay: 2s;
        }

        .circle:nth-child(3) {
            width: 250px;
            height: 250px;
            top: 20%;
            right: 10%;
            animation-delay: 4s;
        }

        .circle:nth-child(4) {
            width: 150px;
            height: 150px;
            bottom: 10%;
            right: 20%;
            animation-delay: 1s;
        }

        @keyframes float {
            0%,100% {
                transform: translateY(0px);
            }
            50% {
                transform: translateY(-25px);
            }
        }

        .container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px;
            text-align: center;
            z-index: 2;
        }

        .hero-card {
            background: rgba(255,255,255,0.15);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 25px;
            padding: 50px;
            max-width: 800px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.2);
        }

        .hero-card h1 {
            font-size: 4rem;
            margin-bottom: 20px;
            text-shadow: 2px 2px 10px rgba(0,0,0,0.2);
        }

        .hero-card p {
            font-size: 1.3rem;
            margin-bottom: 20px;
            line-height: 1.6;
        }

        .tagline {
            color: #fff8dc;
            font-weight: 600;
            margin-bottom: 30px;
        }

        .btn {
            display: inline-block;
            background: white;
            color: #764ba2;
            padding: 14px 28px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: bold;
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        .btn:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }

        .counter-number {
            text-align: center;
            padding: 25px;
            background: rgba(255,255,255,0.15);
            backdrop-filter: blur(15px);
            border-top: 1px solid rgba(255,255,255,0.2);
            z-index: 2;
        }

        .counter-number p {
            font-size: 1.2rem;
            font-weight: 600;
        }

        .emoji {
            font-size: 4rem;
            margin-bottom: 20px;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%,100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-10px);
            }
        }

        @media(max-width:768px) {
            .hero-card {
                padding: 30px;
            }

            .hero-card h1 {
                font-size: 2.5rem;
            }

            .hero-card p {
                font-size: 1.1rem;
            }
        }
    </style>
</head>
<body>

    <!-- Floating Background Elements -->
    <div class="circle"></div>
    <div class="circle"></div>
    <div class="circle"></div>
    <div class="circle"></div>

    <div class="container">
        <div class="hero-card">

            <div class="emoji">🚀</div>

            <h1>Welcome!</h1>

            <p class="tagline">
                Glad you're here ✨
            </p>

            <p>
                This website is hosted on AWS and serves as a playground
                for cloud projects, DevOps experiments, and fun ideas.
            </p>

            <p>
                Explore the site and see what I've been building.
            </p>

            <a href="error.html" class="btn">
                Visit Error Page →
            </a>

        </div>
    </div>

    <div class="counter-number">
        <!-- Updated dynamically by index.js -->
        <p>👀 Visitor Counter Loading...</p>
    </div>

    <script src="index.js"></script>

</body>
</html>
